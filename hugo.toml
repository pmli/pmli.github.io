baseURL = "https://pmli.github.io/"
disableKinds = ["rss", "section", "taxonomy", "term"]
enableRobotsTXT = true
locale = "en"
title = "Petar Mlinarić"

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]

[markup.goldmark.renderer]
unsafe = true

[[menus.main]]
name = "Publications"
pageRef = "/publications"
weight = 10

[[menus.main]]
name = "Travels"
pageRef = "/travels"
weight = 20

# Defining an assets mount replaces the default one, so it is listed too.
# static/images is also mounted so the portrait shortcode can resize it.
[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "static/images"
target = "assets/images"

[params]
author = "Petar Mlinarić"
description = "Personal website of Petar Mlinarić"
images = ["images/mlinaric.jpg"]
license = "MIT License"
licenseURL = "https://spdx.org/licenses/MIT.html"
themeColor = "#5670d4"
